[package]
name = "e2e-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bytes = "1"
viva_streamer = { path = "../../crates/viva_streamer" }
viva-zenoh-api = { path = "../../../crates/viva-zenoh-api" }
viva_xml_model = { path = "../../crates/viva_xml_model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "sync", "net", "io-util"] }
tokio-tungstenite = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
zenoh = "1.8"
