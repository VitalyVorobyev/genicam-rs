[package]
name = "viva_streamer"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
bytes = "1"
viva-zenoh-api = { path = "../../../crates/viva-zenoh-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
zenoh = "1.8"
thiserror = "1"
